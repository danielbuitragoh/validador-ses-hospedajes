[project]
name = "validador-ses-hospedajes"
version = "0.1.0"
description = "Valida ficheros XML de alta masiva de SES.Hospedajes (partes de viajeros y reservas de hospedaje) antes de subirlos al portal. No oficial."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Buitrago" }]
keywords = ["ses-hospedajes", "hospedajes", "partes de viajeros", "xml", "validador", "rd 933/2021"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Spanish",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["defusedxml>=0.7.1"]

[project.urls]
Homepage = "https://github.com/danielbuitragoh/validador-ses-hospedajes"
Issues = "https://github.com/danielbuitragoh/validador-ses-hospedajes/issues"
"Proyecto relacionado" = "https://github.com/danielbuitragoh/registro-viajeros"

[project.scripts]
ses-validar = "validador_ses_hospedajes.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-defusedxml>=0.7.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validador_ses_hospedajes"]

[tool.hatch.build.targets.sdist]
# El PDF oficial del Ministerio NO se redistribuye en el paquete: está en el repositorio (docs/oficial/).
include = ["src", "tests", "docs/oficial/NOTAS.md", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT", "RET"]
# RUF001-003: el código y los mensajes están en español (comillas «», ñ, tildes) a propósito.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
